# SonarCloud / SonarQube Project Configuration for Expense Tracker API

# Must match your project key in SonarCloud
sonar.projectKey=devsecops-p5-0110223013

# The organization key in SonarCloud (e.g., your GitHub username or SonarCloud org)
# Replace with your actual SonarCloud organization key or pass via -Dsonar.organization=$SONAR_ORGANIZATION in CI
# sonar.organization=your-sonarcloud-organization

# Human-readable project name
sonar.projectName=Expense Tracker API
sonar.projectVersion=1.0.0

# Source code directories
sonar.sources=app

# Test code directories
sonar.tests=tests

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Python specific settings
sonar.python.version=3.12

# Python test execution & code coverage report path generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Inclusions and Exclusions
sonar.exclusions=**/.venv/**,**/__pycache__/**,**/expenses.db,**/bandit_report.*
sonar.test.inclusions=tests/**